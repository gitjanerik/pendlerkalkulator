<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efeae0" />
    <meta name="description" content="Finn billigste kjede av periodebilletter for arbeidsreisen din." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pendler" />
    <title>Pendlerkalkulator</title>
    <script>
      /* Installeringsforespørselen kommer én gang, ofte før Vue er lastet. */
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault()
        window.__deferredInstallPrompt = e
      })
      window.addEventListener('appinstalled', function () {
        window.__deferredInstallPrompt = null
        window.__appInstalled = true
      })
    </script>
    <script>
      /* Tema og tekststørrelse settes før første bilde, så det ikke blinker. */
      try {
        var t = localStorage.getItem('pendler-tema')
        if (t === 'lys' || t === 'mork') document.documentElement.dataset.theme = t
        var s = Number(localStorage.getItem('pendler-skala'))
        if (s >= 100 && s <= 200) document.documentElement.style.fontSize = s + '%'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
